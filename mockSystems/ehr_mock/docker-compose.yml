services:
  ehr:
    build: .
    container_name: mock-ehr
    ports:
      - "8000:8000"
    environment:
      EHR_API_TOKEN: ${EHR_API_TOKEN:-dev-ehr-token-change-me}
      EHR_BASE_URL: ${EHR_BASE_URL:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
