<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXL Integration Factory</title><style>body{font:15px system-ui;background:#f3f6fa;color:#182638;margin:0}header{background:#142b43;color:white;padding:24px 5vw}main{max-width:1050px;margin:24px auto;padding:0 18px}.card{background:white;border:1px solid #dce4ee;border-radius:12px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.muted{color:#63758a;font-size:13px}button{padding:10px 15px;background:#1769aa;color:white;border:0;border-radius:7px;margin:4px;cursor:pointer}pre{background:#122235;color:#d9e8f6;padding:14px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}</style></head><body><header><h1>Agentic Healthcare Integration Factory</h1>EXL × UCD · Challenge 01 · Synthetic-data prototype</header><main><section class="card"><h2>Discovered mock systems</h2><div id="systems" class="grid">Loading…</div></section><section class="card"><h2>Run integration</h2><p class="muted">Builds a FHIR-aligned patient context from EHR + LIS + HIS. PACS is queried if online. RPM stays unlinked until an approved identity crosswalk exists.</p><button onclick="run()">Run for John Smith</button><span id="status" class="muted"></span></section><div id="result"></div></main><script>
async function load(){let a=await fetch('/api/systems').then(r=>r.json());document.getElementById('systems').innerHTML=a.map(x=>`<div class="card"><b>${x.name}</b><p>${x.interface}</p><div class="muted">${x.connectivity}</div></div>`).join('')}
async function run(){document.getElementById('status').textContent='Working…';let r=await fetch('/api/runs',{method:'POST'}),d=await r.json();if(!r.ok){document.getElementById('status').textContent=d.detail;return}document.getElementById('status').textContent=d.status;document.getElementById('result').innerHTML=`<section class="card"><h2>${d.run_id}</h2><p>${d.status} · ${d.validation.summary}</p><h3>Validation</h3>${d.validation.checks.map(c=>`<p>${c.passed?'✓':'✕'} ${c.name}: ${c.detail}</p>`).join('')}<button onclick="approve('${d.run_id}','approve-mapping')">Approve mappings</button><button onclick="approve('${d.run_id}','approve-release')">Approve release</button><h3>Unified patient context</h3><pre>${JSON.stringify(d.patient_context,null,2)}</pre><h3>Integration plan</h3><pre>${JSON.stringify(d.plan,null,2)}</pre></section>`}
async function approve(id,step){let r=await fetch(`/api/runs/${id}/${step}`,{method:'POST'}),d=await r.json();alert(r.ok?d.status:d.detail)}load();
</script></body></html>
