<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXL Integration Factory</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--line:#dce4ee;--ink:#182638;--muted:#63758a;--brand:#1769aa;--head:#142b43;--ok:#1a7f4b;--bad:#b3261e;--warn:#9a6700;--code:#122235}
*{box-sizing:border-box}
body{font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0}
header{background:var(--head);color:#fff;padding:22px 5vw}header h1{margin:0 0 4px;font-size:24px}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
h2{margin:0 0 12px;font-size:18px}h3{margin:18px 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px}
.muted{color:var(--muted);font-size:13px}
.num{font-size:22px;font-weight:650}
button{padding:10px 15px;background:var(--brand);color:#fff;border:0;border-radius:7px;margin:4px 6px 4px 0;cursor:pointer;font:inherit}
button.alt{background:#fff;color:var(--brand);border:1px solid var(--brand)}button:disabled{opacity:.5;cursor:default}
select{padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit;margin-right:6px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.llm{color:#5b3cc4;border-color:#c9bdf2}.tag.fault_injected{color:var(--bad);border-color:#f0b9b5}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;background:var(--ok)}
.dot.fail{background:var(--bad)}
.agent{font-weight:650}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 9px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;border-top:0}
code,pre{font:12.5px ui-monospace,Menlo,monospace}
pre{background:var(--code);color:#d9e8f6;padding:14px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:380px;overflow:auto;margin:8px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.status{font-weight:650;padding:4px 10px;border-radius:7px;background:#e8f0f8}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.st{flex:1;min-width:120px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--muted);background:#fff}
.st b{display:block;color:var(--ink);font-size:13px}.st.done{border-color:#a9dcc0;background:#f0faf4}.st.done b{color:var(--ok)}
.st.fail{border-color:#f0b9b5;background:#fdf1f0}.st.fail b{color:var(--bad)}.st.now{border-color:var(--brand);box-shadow:0 0 0 2px #cfe3f4}
.banner{border-radius:10px;padding:14px 16px;border:1px solid;margin:10px 0}
.banner h3{margin:0 0 6px;font-size:16px}.banner.bad{background:#fdf1f0;border-color:#f0b9b5}.banner.info{background:#eef5fc;border-color:#bcd7ee}
.banner.good{background:#f0faf4;border-color:#a9dcc0}
.fix{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.fix input[type=text]{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit;margin:6px 0}
textarea.code{width:100%;min-height:260px;background:var(--code);color:#d9e8f6;border-radius:8px;padding:12px;font:12.5px ui-monospace,Menlo,monospace;border:0}
button.danger{background:var(--bad)}button.green{background:var(--ok)}
#toast{position:fixed;right:18px;bottom:18px;max-width:420px;padding:12px 16px;border-radius:9px;color:#fff;background:var(--head);box-shadow:0 6px 24px #0004;display:none;z-index:9}
#toast.bad{background:var(--bad)}#toast.good{background:var(--ok)}
.log td{font-size:13px}

/* visual polish */
body{font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#eaf1f8 0,#f3f6fa 320px);-webkit-font-smoothing:antialiased}
header{background:linear-gradient(120deg,#0f2236 0,#142b43 45%,#1769aa 130%);padding:30px max(5vw,calc((100vw - 1100px)/2 + 16px));color:#c9dcee;font-size:13.5px;letter-spacing:.02em;box-shadow:0 2px 14px #0f223633}
header h1{font-size:27px;letter-spacing:-.01em;color:#fff;margin:0 0 6px}
main{margin:26px auto 60px}
.card{border-radius:16px;padding:24px;margin:16px 0;border-color:#e3eaf2;box-shadow:0 1px 2px #14213d0a,0 8px 24px #14213d0d}
h2{font-size:19px;letter-spacing:-.01em;margin:0 0 14px}
.grid{gap:14px}
.tile{border-radius:12px;overflow-wrap:anywhere;min-width:0;padding:14px 16px;background:linear-gradient(180deg,#fff,#f8fbfe);border-color:#e3eaf2;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px #14213d14}
.num{font-size:26px;font-weight:700;color:var(--brand);letter-spacing:-.01em}
button{padding:11px 18px;border-radius:9px;font-weight:600;box-shadow:0 1px 2px #14213d26;transition:filter .15s,transform .05s}
button:hover:not(:disabled){filter:brightness(1.08)}button:active:not(:disabled){transform:translateY(1px)}
button.alt{box-shadow:none}button.alt:hover:not(:disabled){background:#eef5fc;filter:none}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #9cc8ec;outline-offset:2px}
select{padding:10px 12px;border-radius:9px;background:#fff}
.tag{font-weight:600;padding:3px 10px;background:#f4f7fb}
.tag.llm{background:#f3f0fd}.tag.fault_injected{background:#fdf1f0}.tag.sandbox{color:#0b6b6b;border-color:#b5dede;background:#eefafa}
.step{padding:12px 0;align-items:start}
.dot{box-shadow:0 0 0 4px #1a7f4b1f}.dot.fail{box-shadow:0 0 0 4px #b3261e1f}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:#f6f9fc}
th,td{padding:9px 11px}tbody tr:hover td{background:#fafcfe}
pre{border-radius:10px;padding:16px;line-height:1.55}
.status{border-radius:99px;padding:5px 12px}
.st{border-radius:10px;padding:10px 12px}
.banner{border-radius:12px;padding:16px 18px}
</style></head>
<body>
<header><h1>Agentic Healthcare Integration Factory</h1>EXL × UCD · Challenge 01 · Synthetic data only</header>
<main>
<section class="card"><h2>Systems found by the Discovery Agent</h2><div id="systems" class="grid">Loading…</div></section>
<section class="card"><h2>Run the agent pipeline</h2>
  <p class="muted">Discover → design mappings and pattern → generate adapters → test in a sandbox and repair → stop for human approval.</p>
  <select id="patient"><option value="ehr-pat-001">John Smith (ehr-pat-001)</option></select>
  <button id="go" onclick="run(false)">Run agent pipeline</button>
  <button id="fault" class="alt" onclick="run(true)">Run with an injected defect</button>
  <span id="status" class="muted"></span>
</section>
<div id="result"></div><div id="toast" role="status" aria-live="polite"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=m=>`<span class="tag ${esc(m)}">${esc(String(m).replace(/_/g,' '))}</span>`;
let current=null;

async function load(){
  const systems=await fetch('/api/systems').then(r=>r.json());
  $('systems').innerHTML=systems.map(s=>`<div class="tile"><b>${esc(s.name)}</b> ${tag(s.discovery_mode)}<div>${esc(s.interface)}</div>
    <div class="muted">${s.discovered_fields.length} fields · ${esc(s.evidence[0])}</div></div>`).join('');
}

let tt; function toast(msg,kind){const t=$('toast'); t.textContent=msg; t.className=kind||''; t.style.display='block'; clearTimeout(tt); tt=setTimeout(()=>t.style.display='none',kind==='bad'?9000:4500)}
async function call(url,opts,btn,busyText){
  const old=btn&&btn.textContent; if(btn){btn.disabled=true; btn.textContent=busyText||'Working…'}
  try{
    const r=await fetch(url,opts), d=await r.json().catch(()=>({}));
    if(!r.ok){ toast(typeof d.detail==='string'?d.detail:'Request failed ('+r.status+')','bad'); if(r.status===404&&current&&/Run not found/.test(d.detail||'')){current=null;$('result').innerHTML=''} return null }
    return d;
  }catch(e){toast('Network error: '+e.message,'bad'); return null}
  finally{ if(btn){btn.disabled=false; btn.textContent=old} }
}

async function run(fault){
  $('go').disabled=$('fault').disabled=true; $('status').textContent='Agents working…';
  const d=await call(`/api/agentic-runs?patient_id=${$('patient').value}&inject_fault=${fault}`,{method:'POST'});
  $('go').disabled=$('fault').disabled=false; $('status').textContent='';
  if(d){current=d; render(); window.scrollTo({top:$('result').offsetTop-10,behavior:'smooth'})}
}

const failing=d=>(d.agent_validation||[]).filter(r=>!r.passed);
function stepper(d){
  const fails=failing(d).length>0, a=d.approvals, ok=d.validation.passed;
  const steps=[['Discover','done'],['Design','done'],['Generate','done'],['Validate',fails||!ok?'fail':'done'],
    ['Approve mappings',a.mapping_approved?'done':(ok?'now':'')],['Approve release',a.release_approved?'done':(a.mapping_approved?'now':'')]];
  return `<div class="steps">${steps.map((x,n)=>`<div class="st ${x[1]}"><b>${n+1}. ${x[0]}</b>${x[1]==='done'?'Complete':x[1]==='fail'?'Needs correction':x[1]==='now'?'Your turn':'Waiting'}</div>`).join('')}</div>`;
}
function banner(d){
  const f=failing(d), a=d.approvals;
  if(f.length) return `<div class="banner bad"><h3>✕ Action required — ${f.map(r=>esc(r.system)).join(', ')} adapter${f.length>1?'s':''} failed validation</h3>
    Nothing can be approved until this is fixed. Choose how to fix it in the panel${f.length>1?'s':''} below: ask the AI to try again (optionally with guidance), regenerate from the approved mappings (safe, deterministic), or edit the code yourself. Every fix is re-tested and logged.</div>`;
  if(!d.validation.passed) return `<div class="banner bad"><h3>✕ Identity/data checks failed</h3>Review the failing checks under “Identity and data checks”. This needs a mapping or crosswalk change, so start a new run after correcting the source data.</div>`;
  if(a.release_approved) return `<div class="banner good"><h3>✓ Approved for release</h3>Adapters, plan and reports are saved under <code>${esc((d.generated_artifacts[0]||'').split('/').slice(0,-2).join('/')||'artifacts/'+d.run_id)}</code>. The decision trail is in the audit log below.</div>`;
  if(a.mapping_approved) return `<div class="banner info"><h3>Step 2 of 2 — approve the release</h3>Mappings are approved. Approving the release marks the adapters ready to deploy.</div>`;
  return `<div class="banner info"><h3>Step 1 of 2 — review and approve the mappings</h3>All adapters passed their tests. Check the field mappings${d.metrics.mappings_flagged_for_review?` (<span class="warn">${d.metrics.mappings_flagged_for_review} flagged for review</span>)`:''}, then approve.</div>`;
}
function fixPanel(d,r){
  const sys=esc(r.system), bad=r.checks.filter(c=>!c.passed);
  return `<div class="fix"><b class="bad">✕ ${sys} adapter</b> <span class="muted">${esc(r.summary)} · ${r.attempts} attempt${r.attempts>1?'s':''} so far</span>
    ${bad.map(c=>`<div><b>${esc(c.name)}</b><div class="muted">${esc(c.detail)}</div></div>`).join('')}
    <input type="text" id="hint-${sys}" placeholder="Optional guidance for the AI, e.g. “return None when the date is not 8 digits”">
    <button onclick="retry('${sys}','ai',this)">Retry with AI</button>
    <button class="alt" onclick="retry('${sys}','template',this)">Regenerate from mappings (safe template)</button>
    <button class="alt" onclick="$('edit-${sys}').open=true">Edit code manually</button>
    <details id="edit-${sys}"><summary>Edit ${sys} adapter code</summary>
      <textarea class="code" id="code-${sys}" spellcheck="false">${esc(d.adapters[r.system])}</textarea>
      <button onclick="saveCode('${sys}',this)">Save and re-run tests</button> <span class="muted">Runs the same safety scan, sandbox and reconciliation checks.</span></details></div>`;
}

function render(){
  const d=current, m=d.metrics, approved=d.approvals, fails=failing(d);
  const canApprove=d.validation.passed;
  const tiles=[[m.elapsed_seconds+' s','end-to-end run'],[m.fields_discovered,'fields discovered in '+m.systems_discovered+' systems'],
    [m.mappings_grounded,'mappings grounded ('+m.mappings_rejected+' rejected)'],[m.adapters_generated,'adapters generated'],
    [m.checks_passed+'/'+m.checks_total,'validation checks passed'],[m.field_values_reconciled,'field values reconciled'],
    [m.repair_attempts,'automatic repair attempts'],[m.llm_calls,'LLM calls']];
  $('result').innerHTML=`
  <section class="card"><h2>${esc(d.run_id)} <span class="status">${esc(d.status.replace(/_/g,' '))}</span></h2>
    <div class="muted">Mode: ${esc(m.mode)}${m.llm_model?' · model '+esc(m.llm_model):''}</div>
    ${stepper(d)}${banner(d)}
    ${fails.map(r=>fixPanel(d,r)).join('')}
    <h3>Human approval gates</h3>
    <button class="green" id="b1" onclick="approve('approve-mapping',this)" ${approved.mapping_approved||!canApprove?'disabled':''}>${approved.mapping_approved?'✓ Mappings approved':'1. Approve mappings'}</button>
    <button class="green" id="b2" onclick="approve('approve-release',this)" ${approved.release_approved||!approved.mapping_approved?'disabled':''}>${approved.release_approved?'✓ Release approved':'2. Approve release'}</button>
    <div class="muted" style="margin-top:6px">${!canApprove?'Disabled: fix the failing validation above first.':!approved.mapping_approved?'Approve the mappings first; the release step unlocks after that.':!approved.release_approved?'':'Done.'}</div>
    <div class="grid" style="margin-top:12px">${tiles.map(t=>`<div class="tile"><div class="num">${esc(t[0])}</div><div class="muted">${esc(t[1])}</div></div>`).join('')}</div>
  </section>
  <section class="card"><h2>Agent trace</h2>${d.trace.map(e=>`<div class="step"><div class="dot ${e.ok?'':'fail'}">${e.ok?'✓':'✕'}</div>
    <div><span class="agent">${esc(e.agent)}</span> · ${esc(e.action)} ${tag(e.mode)} <span class="muted">${e.ms} ms</span>
    <div class="${e.ok?'muted':'bad'}">${esc(e.detail)}</div></div></div>`).join('')}</section>
  <section class="card"><h2>Integration patterns chosen</h2><div class="wrap"><table><tr><th>System</th><th>Interface</th><th>Pattern</th><th>Why</th></tr>
    ${d.plan.patterns.map(p=>`<tr><td><b>${esc(p.system)}</b></td><td>${esc(p.interface)}</td><td>${esc(p.pattern)}</td><td class="muted">${esc(p.rationale)}</td></tr>`).join('')}</table></div></section>
  <section class="card"><h2>Field mappings for review</h2><div class="wrap"><table><tr><th>System</th><th>Source field</th><th>FHIR target</th><th>Transform</th><th>Confidence</th><th>Rationale</th></tr>
    ${d.plan.mappings.map(x=>`<tr><td>${esc(x.source_system)}</td><td><code>${esc(x.source_field)}</code></td><td><code>${esc(x.target_path)}</code></td><td>${esc(x.transform)}</td>
      <td>${Math.round(x.confidence*100)}%${x.requires_review?' <span class="warn">⚠ review</span>':''}</td><td class="muted">${esc(x.rationale)}</td></tr>`).join('')}
    ${d.plan.rejected_mappings.map(x=>`<tr><td>${esc(x.source_system)}</td><td><code>${esc(x.source_field)}</code></td><td><code>${esc(x.target_path)}</code></td><td>${esc(x.transform)}</td>
      <td class="bad">rejected</td><td class="bad">${esc(x.rejected_reason)}</td></tr>`).join('')}</table></div></section>
  <section class="card"><h2>Generated adapters and their tests</h2>${d.agent_validation.map(r=>`<details><summary>${esc(r.system)} adapter —
    <span class="${r.passed?'ok':'bad'}">${esc(r.summary)}</span> <span class="muted">(${r.attempts} attempt${r.attempts>1?'s':''})</span></summary>
    ${r.checks.map(c=>`<div><span class="${c.passed?'ok':'bad'}">${c.passed?'✓':'✕'}</span> <b>${esc(c.name)}</b> <span class="muted">${esc(c.detail)}</span></div>`).join('')}
    <pre>${esc(d.adapters[r.system])}</pre></details>`).join('')}</section>
  <section class="card"><h2>Identity and data checks</h2>${d.validation.checks.map(c=>`<div><span class="${c.passed?'ok':'bad'}">${c.passed?'✓':'✕'}</span> <b>${esc(c.name)}</b> <span class="muted">${esc(c.detail)}</span></div>`).join('')}
    <details style="margin-top:12px"><summary>Unified patient context (FHIR-aligned)</summary><pre>${esc(JSON.stringify(d.patient_context,null,2))}</pre></details></section>
  <section class="card"><h2>Audit log</h2>${(d.audit&&d.audit.length)?`<div class="wrap"><table class="log"><tr><th>When (UTC)</th><th>Who</th><th>Action</th><th>Detail</th></tr>${d.audit.map(a=>`<tr><td>${esc(a.at.replace('T',' '))}</td><td>${esc(a.actor)}</td><td>${esc(a.action.replace(/_/g,' '))}</td><td class="muted">${esc(a.detail)}</td></tr>`).join('')}</table></div>`:'<div class="muted">No reviewer actions yet.</div>'}</section>`;
}

async function approve(step,btn){
  const d=await call(`/api/runs/${current.run_id}/${step}`,{method:'POST'},btn,'Approving…');
  if(d){current=d; render(); toast(step==='approve-mapping'?'Mappings approved. Now approve the release.':'Release approved.','good')}
}
async function retry(system,strategy,btn){
  const hint=($('hint-'+system)||{}).value||'';
  const q=`strategy=${strategy}`+(hint?`&hint=${encodeURIComponent(hint)}`:'');
  const d=await call(`/api/runs/${current.run_id}/adapters/${system}/retry?${q}`,{method:'POST'},btn,strategy==='ai'?'Asking the AI…':'Regenerating…');
  if(d){current=d; render(); const r=d.agent_validation.find(x=>x.system===system); toast(r.passed?`${system} adapter now passes all checks.`:`${system} adapter still failing: try another option.`,r.passed?'good':'bad')}
}
async function saveCode(system,btn){
  const d=await call(`/api/runs/${current.run_id}/adapters/${system}/code`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code-'+system).value})},btn,'Testing…');
  if(d){current=d; render(); const r=d.agent_validation.find(x=>x.system===system); toast(r.passed?`${system} adapter now passes all checks.`:`${system} adapter still failing: ${r.checks.find(c=>!c.passed).detail}`,r.passed?'good':'bad')}
}
load();
</script></body></html>
